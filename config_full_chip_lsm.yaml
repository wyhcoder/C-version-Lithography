# 全芯片 LSM：接已有 CTM 二值化结果；所有路径相对于本 YAML 所在目录。
system:
  wavelength_nm: 193.0
  pixel_size_nm: 8.0
  grid_size_pixel: 1024
mask:
  image_name: contact_1_0_only_1024
  row_grid_size: 1024
optics:
  na: 1.35
  refractive_index: 1.44
  aberrations: {4: 0.0}
source:
  type: annular
  sigma_in: 0.6
  sigma_out: 0.9
resist:
  model: threshold
  threshold: 0.25
  alpha: 85

full_chip_lsm:
  target_path: assets/target_pattern/contact_1_0_only_1024.bmp
  initial_mask_path: result/full_chip_ctm/contact_1_0_only_1024/binary_mask.txt
  output_dir: result/full_chip_lsm/contact_1_0_only_1024
  grid_rows: 8                # 共 64 Micro，Core 为 128×128。
  grid_cols: 8
  halo: 64                   # 完整局部成像网格为 256×256。
  guard: 30                  # 损失和 phi 更新采用 Core + Guard；窗口之外的 phi 保持初始化值。
  imaging_source_grid_size: 256 # 最终对比的照明积分采样；全图光瞳/FFT 按版图尺寸重建为 1024×1024。
  iterations: 100            # 命令行第二个参数可覆盖更新次数。
  cfl: 0.8                   # 各块用自己的 CFL dt；不采用固定学习率。
  curvature_weight: 0.01     # 原 C++ LSM 的曲率系数 b。
  reinit_interval: 20         # 每 20 次更新重新计算 SDF；0 关闭。
  parallel_micro: true
  loss_type: PEPenalty            # PE / PEPenalty / EPE / PE_EPE，复用已有 C++ 损失及梯度。
  pe_weight: 0.5
  epe_weight: 0.5
  penalty_weight: 1.0
  penalty_threshold: 0.01
  epe_interval_line: 6
  epe_interval_corner: 2
  enable_cept: true
  cept_weight: 0.5
  enable_grad_fusion: true
  fusion_mode: Average       # Average / Linear；仅融合 Guard 的数据梯度。
  fusion_weight_owner: 0.5
  fusion_weight_neighbor: 0.5
