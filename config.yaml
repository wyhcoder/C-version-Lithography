# =====================================================
# 仿真系统级参数 (Simulation System)
# =====================================================
PATTERN_NAME: &PATTERN_NAME "工字型"   # 对应 target_pattern/matrix_0525.bmp

system:
  wavelength_nm: 193.0
  pixel_size_nm: 4.0
  grid_size_pixel: 257

# =====================================================
# 掩模版参数 (Mask)
# =====================================================
mask:
  image_name: *PATTERN_NAME      # 默认读取 pattern_data 文件夹下的 .bmp
  row_grid_size: 256
# =====================================================
# 光学系统参数 (Optics)
# =====================================================
optics:
  na: 1.35
  refractive_index: 1.44         # 物镜空间折射率 n
  aberrations:
    {4: 0.0}                    # Zernike 像差项

# =====================================================
# 光源参数 (Source)
# =====================================================
source:
  type: "annular"                # conventional / annular / dipole / quasar
  sigma_in: 0.6
  sigma_out: 0.9

# =====================================================
# 光刻胶模型参数 (Resist Model)
# =====================================================
resist:
  model: "threshold"             # threshold / sigmoid
  threshold: 0.25
  alpha: 85

# =====================================================
# MEEF 优化参数（demo_MEEF_Optimizer_init）
# 所有路径相对于项目根目录；运行时会把本配置复制到输出目录。
# =====================================================
meef:
  output_dir: "result/MEEF_result/test"
  config_snapshot_name: "config_used.yaml"
  console_log_name: "console_output.log"
  lsm_mask_path: "assets/lsm_mask/ls_image工字型.txt"
  run_mode: "--optimize"       # --init-only / --build-meef / --optimize
  pattern_name: *PATTERN_NAME
  move_strategy: "xy"
  iter: 50
  step_tol: 0.0
  patience: 3
  main_cp_interval: 7
  main_symmetry: "none"
  sraf_cp_interval: 5
  sraf_min_cps: 8
  sraf_min_aera: 50
  msaa_level: 16
  curve_type: "BS"
  delta: 0.15
  dilate_radius: 2
  interval_line: 5
  interval_corner: 2
  mid_weight: 4.0
  other_weight: 1.0
  optimize_wepe_only: false


