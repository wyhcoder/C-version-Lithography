# 共用图案名；修改一次即可同步 mask 和 MEEF。
PATTERN_NAME: &PATTERN_NAME "img9"

# 成像模型
system:
  wavelength_nm: 193.0
  pixel_size_nm: 4.0
  grid_size_pixel: 257

mask:
  image_name: *PATTERN_NAME
  row_grid_size: 256

optics:
  na: 1.35
  refractive_index: 1.44
  aberrations: {4: 0.0}

source:
  type: "annular"                  # conventional / annular / dipole / quasar
  sigma_in: 0.6
  sigma_out: 0.9

resist:
  model: "threshold"               # threshold / sigmoid
  threshold: 0.25
  alpha: 85

# MEEF 优化：路径均相对于项目根目录。
meef:
  # 运行与输出
  output_dir: "result/MEEF_result/test"
  config_snapshot_name: "config_used.yaml"
  console_log_name: "console_output.log"
  lsm_mask_path: "result/LSM_result/LSM_mask.txt"
  run_mode: "--optimize"           # --init-only / --build-meef / --optimize
  pattern_name: *PATTERN_NAME

  # 迭代
  move_strategy: "xy"
  iter: 10
  step_tol: 0.0                    # 0 表示关闭位移提前终止
  patience: 3

  # 主图形控制点
  main_cp_mode: "target_interval"  # target_interval / npy
  main_cps_npy_path: "/Users/wangyuhang/Desktop/school/Litho_Simulation_cpu/OPCproject/DPS/DPS_data/CPS/工字型0.8.npy"
  main_cp_interval: 7
  main_symmetry: "none"            # none / center / left-right / diagonal

  # 固定 SRAF
  sraf_mask_mode: "lsm"            # lsm / fitted_txt
  fitted_sraf_txt_path: "/Users/wangyuhang/Desktop/school/Litho_Simulation_cpu/outputs/opc/DPS/DPS_data/LSmask/工字型BS0.8.txt"
  sraf_cp_interval: 5
  sraf_min_cps: 8
  sraf_min_aera: 50                # 字段名沿用现有拼写

  # 曲线、EPE 与光栅化
  curve_type: "BS"                 # OA / BZ / BS
  msaa_level: 16                   # 4 / 16 / 64
  rasterizer: "msaa"               # msaa / dirac
  delta: 0.15
  dilate_radius: 2
  interval_line: 5
  interval_corner: 2
  mid_weight: 4.0
  other_weight: 1.0
  optimize_wepe_only: false

# SRAF 宽度优化（demo_SRAF_Optimizer_init）
# 路径均相对于项目根目录；宽度、间隔和半径的单位均为像素。
sraf_optimizer:
  paths:
    lsm_mask_path: "result/LSM_result/LSM_mask.txt"
    main_control_points_path: "result/MEEF_result/test/best_wepe/control_points.txt"
    output_dir: "outputs/sraf_optimizer_init"

  # 从 LSM mask 中分离 SRAF、提取骨架并采样控制点。
  geometry:
    foreground_threshold: 1.0e-6
    target_threshold: 0.0
    overlap_ratio: 0.05
    fallback_dilate_radius: 3
    opening_radius: 0
    minimum_component_area: 3
    control_point_interval: 10

  # 根据曲线与半宽重新生成主图形/SRAF mask。
  rendering:
    curve_type: "BS"               # OA / BZ / BS
    initial_half_width: 2.0
    maximum_half_width: 5.0         # 距离缓存覆盖上限
    samples_per_axis: 4             # 每像素使用 4×4 个子像素采样点
    main_mask_msaa_level: 16        # 4 / 16 / 64

  evaluation:
    epe:
      interval_line: 5
      interval_corner: 2
      mid_weight: 4.0
      other_weight: 1.0
    pv_band:
      dose_margin: 0.05
      defocus_range: 200.0
      defocus_step: 3
      mode: "full"                  # dose_only / defocus_only / full

  width_optimization:
    mode: "independent"             # shared / independent
    shared:
      min_half_width: 1.0
      max_half_width: 4.0
      coarse_step: 0.5
      fine_step: 0.1
    independent:
      min_half_width: 1.0
      max_half_width: 4.0
      cma_es:
        initial_sigma: 0.375
        population_size: 12
        max_evaluations: 1200
        tolerance_x: 1.0e-2
        tolerance_fun: 1.0e-3
        seed: 1                     # 正数用于复现实验；0 表示随机种子

  # cost = 三项归一化损失的加权和。
  objective:
    pv_band_weight: 0.90
    weighted_epe_weight: 0.05
    pixel_error_weight: 0.05
